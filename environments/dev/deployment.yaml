apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopeful-api
  namespace: gitops-demo
  labels:
    app.kubernetes.io/name: hopeful-api
    app.kubernetes.io/part-of: hopeful-gitops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hopeful-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hopeful-api
    spec:
      containers:
        - name: hopeful-api
          image: hopeful-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hopeful-api-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
