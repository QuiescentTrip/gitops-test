apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hopeful-api-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hopeful-gitops-lab
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/gitops-demo.git
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
